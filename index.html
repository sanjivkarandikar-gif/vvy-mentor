<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>VVY Mentor - Student Connect App</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VVY Mentor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0F766E">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
html{height:100%;overflow:hidden;overscroll-behavior:none;background:#F4F6F8}
body{margin:0;position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;overscroll-behavior:none;background:#F4F6F8}
iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block}
.msg{font-family:system-ui,-apple-system,sans-serif;padding:60px 24px;text-align:center;color:#556274}
</style>
</head>
<body>
<script>
var APP = 'https://script.google.com/macros/s/AKfycbx1CbgLCGyuGj26cJGkNQrU0OgRbDzkUrLPbFuxJZs2xuMF_cr15-gz_rEhjyGbNt4Oig/exec';
var k = new URLSearchParams(location.search).get('k');
try { if (k) localStorage.setItem('vvy_k', k); else k = localStorage.getItem('vvy_k'); } catch (e) {}
if (!k) {
  document.body.innerHTML = '<div class="msg"><img src="icon-192.png" width="96" height="96" alt="VVY logo"><h2>VVY Mentor - Student Connect App</h2>' +
    '<p>Please open your personal link sent by the VVY core team, or paste it here:</p>' +
    '<input id="lk" placeholder="Paste your personal link" style="width:100%;max-width:360px;box-sizing:border-box;padding:12px;border:1px solid #CBD5E1;border-radius:10px;font-size:15px">' +
    '<p><button id="go" style="height:44px;padding:0 20px;border:0;border-radius:10px;background:#0F766E;color:#fff;font-size:15px;font-weight:600">Open</button></p></div>';
  document.getElementById('go').onclick = function () {
    var v = document.getElementById('lk').value.trim(), m = v.match(/[?&]k=([0-9a-zA-Z]+)/), key = m ? m[1] : (/^[0-9a-zA-Z]{20,}$/.test(v) ? v : '');
    if (!key) { alert('That does not look like a VVY Mentor - Student Connect App link.'); return; }
    try { localStorage.setItem('vvy_k', key); } catch (e) {}
    location.replace(location.pathname + '?k=' + key);
  };
} else {
  var f = document.createElement('iframe');
  f.src = APP + '?k=' + encodeURIComponent(k);
  f.title = 'VVY Mentor - Student Connect App';
  document.body.appendChild(f);
  var settle = function () { if (window.visualViewport && window.visualViewport.scale > 1.01) return; if (window.scrollX || window.scrollY) window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; };
  window.addEventListener('scroll', settle, { passive: true });
  window.addEventListener('focus', settle);
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', settle); }
  setInterval(settle, 1000);
}
</script>
</body>
</html>
